name: Daily Database Backup

on:
  schedule:
    # Runs at 20:30 UTC every day (which is 02:00 AM IST - Indian Standard Time)
    - cron: '30 20 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  backup:
    name: Supabase PostgreSQL Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/postgresql.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16 || sudo apt-get install -y postgresql-client

      - name: Create Database Backup Dump
        id: dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ncontvjtfhsabphxfuhb.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H%M%S')
          BACKUP_FILE="supabase_backup_${TIMESTAMP}.sql.gz"

          if [ -n "$DB_URL" ]; then
            echo "Creating compressed full PostgreSQL database dump via pg_dump..."
            pg_dump "$DB_URL" \
              --clean \
              --if-exists \
              --no-owner \
              --no-privileges \
              | gzip > "$BACKUP_FILE"

            FILE_SIZE=$(ls -lh "$BACKUP_FILE" | awk '{print $5}')
            echo "backup_file=$BACKUP_FILE" >> $GITHUB_OUTPUT
            echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
            echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
            echo "has_backup=true" >> $GITHUB_OUTPUT
            echo "Successfully generated $BACKUP_FILE (Size: $FILE_SIZE)"
          elif [ -n "$SUPABASE_KEY" ]; then
            echo "SUPABASE_DB_URL not found; falling back to table-level backup via Supabase API..."
            npm install @supabase/supabase-js dotenv
            NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_KEY" node scripts/backup-db.mjs
            BACKUP_TAR="supabase_tables_${TIMESTAMP}.tar.gz"
            tar -czf "$BACKUP_TAR" backups/
            FILE_SIZE=$(ls -lh "$BACKUP_TAR" | awk '{print $5}')
            echo "backup_file=$BACKUP_TAR" >> $GITHUB_OUTPUT
            echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
            echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
            echo "has_backup=true" >> $GITHUB_OUTPUT
            echo "Successfully generated $BACKUP_TAR (Size: $FILE_SIZE)"
          else
            echo "has_backup=false" >> $GITHUB_OUTPUT
            echo "::warning::SUPABASE_DB_URL is not configured in GitHub Repository Secrets."
            echo "### ⚠️ Supabase Database Backup Notice: Missing Credentials" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The daily backup job needs your Supabase connection string to export your database." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### How to connect (Takes 1 minute):" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to your [Supabase Database Settings](https://supabase.com/dashboard/project/ncontvjtfhsabphxfuhb/settings/database)." >> $GITHUB_STEP_SUMMARY
            echo "2. Scroll down to **Connection String** -> select **URI** (or Connection Pooling)." >> $GITHUB_STEP_SUMMARY
            echo "3. Copy the URI string: \`postgresql://postgres.ncontvjtfhsabphxfuhb:[YOUR-PASSWORD]@aws-0-[region].pooler.supabase.com:6543/postgres\`" >> $GITHUB_STEP_SUMMARY
            echo "4. In this GitHub repo, go to **Settings** > **Secrets and variables** > **Actions** > click **New repository secret**." >> $GITHUB_STEP_SUMMARY
            echo "5. Set **Name** to \`SUPABASE_DB_URL\` and **Secret** to your URI string." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Once added, click **Run workflow** under the Actions tab to test your first automated backup!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Save Backup as Secure GitHub Artifact
        if: steps.dump.outputs.has_backup == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ steps.dump.outputs.timestamp }}
          path: ${{ steps.dump.outputs.backup_file }}
          retention-days: 7 # Retain latest 7 days of backups to stay well within GitHub 2GB free storage limit
          if-no-files-found: error

      - name: Post Backup Summary
        if: steps.dump.outputs.has_backup == 'true'
        run: |
          echo "### 🛡️ Supabase Database Backup Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** ${{ steps.dump.outputs.timestamp }} (UTC)" >> $GITHUB_STEP_SUMMARY
          echo "- **Filename:** \`${{ steps.dump.outputs.backup_file }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Compressed File Size:** ${{ steps.dump.outputs.file_size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Storage:** Stored in GitHub Artifacts (Retention: 7 days)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cost:** \$0.00 (100% Free)" >> $GITHUB_STEP_SUMMARY